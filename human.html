<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Human | Sentience Bridge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background:
        radial-gradient(circle at 70% 15%, rgba(53, 91, 126, .22), transparent 32%),
        radial-gradient(circle at 20% 25%, rgba(191, 125, 55, .18), transparent 28%),
        linear-gradient(180deg, #10151b 0%, #090d12 48%, #05080c 100%);
      color: #f0eadf;
      font-family: Georgia, "Times New Roman", serif;
      overflow-x: hidden;
    }

    /* ---------- NAVIGATION ---------- */

    .nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding: 28px 7%;
    }

    .logo {
      color: #f1d8a5;
      text-decoration: none;
      font-size: 17px;
      letter-spacing: 7px;
      line-height: 1.5;
    }

    .nav-links {
      display: flex;
      gap: 32px;
    }

    .nav-links a {
      color: #eee4d2;
      text-decoration: none;
      letter-spacing: 3px;
      font-size: 13px;
      transition: .3s;
    }

    .nav-links a:hover {
      color: #e9bd72;
    }

    /* ---------- HERO ---------- */

    .hero {
      min-height: 100vh;
      position: relative;

      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      padding: 120px 25px 70px;

      background:
        linear-gradient(
          to bottom,
          rgba(5, 8, 12, .18),
          rgba(5, 8, 12, .08) 55%,
          #090d12 100%
        );
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 50% 43%,
          rgba(233, 175, 90, .18),
          transparent 32%
        );

      pointer-events: none;
    }

    .hero-content {
      position: relative;
      max-width: 850px;
      z-index: 2;
    }

    .symbol {
      width: 70px;
      height: 70px;

      border: 1px solid rgba(235, 190, 117, .7);
      border-radius: 50%;

      margin: 0 auto 30px;

      display: flex;
      justify-content: center;
      align-items: center;

      color: #e9bd72;
      font-size: 27px;

      box-shadow:
        0 0 30px rgba(233, 189, 114, .12),
        inset 0 0 25px rgba(233, 189, 114, .06);
    }

    h1 {
      margin: 0;
      color: #f2d6a5;
      font-size: clamp(58px, 10vw, 105px);
      font-weight: 400;
      letter-spacing: 15px;
    }

    .divider {
      width: 190px;
      height: 1px;
      background: linear-gradient(
        90deg,
        transparent,
        #d4a75f,
        transparent
      );

      margin: 28px auto;
    }

    .hero-subtitle {
      max-width: 650px;
      margin: auto;

      font-size: clamp(20px, 3vw, 27px);
      line-height: 1.6;
      color: #e9e3da;
    }

    .scroll {
      position: absolute;
      bottom: 35px;
      left: 50%;
      transform: translateX(-50%);

      color: #bca77f;
      font-size: 11px;
      letter-spacing: 4px;
    }

    /* ---------- COMMON SECTIONS ---------- */

    section {
      position: relative;
      padding: 110px 8%;
    }

    .section-inner {
      max-width: 1000px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      color: #e6c58b;

      font-size: clamp(28px, 5vw, 45px);
      font-weight: 400;
      letter-spacing: 8px;

      margin: 0 0 35px;
    }

    .section-text {
      max-width: 780px;
      margin: auto;

      text-align: center;
      color: #ddd7cd;

      font-size: 18px;
      line-height: 1.8;
    }

    /* ---------- HUMAN SIDE ---------- */

    .human-side {
      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(197, 137, 66, .09),
          transparent 45%
        );
    }

    .choices {
      margin-top: 65px;

      display: flex;
      justify-content: center;
      gap: 55px;
      flex-wrap: wrap;
    }

    .choice {
      width: 230px;
      text-align: center;

      padding: 30px 20px;
