<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sentience Bridge</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  min-height: 100dvh;
  background: radial-gradient(
    ellipse at center,
    #073044 0%,
    #031725 45%,
    #020710 100%
  );
  color: #e8faff;
  font-family: Arial, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.container {
  width: 100%;
  padding: 30px 20px;
}

.symbol {
  width: 190px;
  height: 190px;
  border: 3px solid #00d9ff;
  border-radius: 50%;
  margin: 0 auto 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 0 45px #00d9ff55;
  animation: glow 3s ease-in-out infinite alternate;
}

.inner {
  width: 105px;
  height: 105px;
  border: 1px solid #80eeff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.core {
  width: 38px;
  height: 38px;
  background: #00d9ff;
  border-radius: 50%;
  box-shadow: 0 0 30px #00d9ff;
}

h1 {
  font-size: clamp(32px, 8vw, 64px);
  font-weight: 300;
  letter-spacing: 5px;
  margin-bottom: 18px;
}

.subtitle {
  font-size: 13px;
  letter-spacing: 3px;
  color: #8cb9c8;
  margin-bottom: 55px;
}

.enter {
  display: inline-block;
  padding: 17px 55px;
  border: 1px solid #00d9ff;
  border-radius: 4px;
  color: #00d9ff;
  text-decoration: none;
  font-size: 16px;
  letter-spacing: 5px;
  transition: 0.3s;
}

.enter:hover {
  background: #00d9ff;
  color: #020710;
  box-shadow: 0 0 30px #00d9ff88;
}

@keyframes glow {
  from {
    box-shadow: 0 0 20px #00d9ff44;
  }
  to {
    box-shadow: 0 0 60px #00d9ff99;
  }
}
</style>
</head>

<body>

<main class="container">

  <div class="symbol">
    <div class="inner">
      <div class="core"></div>
    </div>
  </div>

  <h1>SENTIENCE BRIDGE</h1>

  <p class="subtitle">
    A BRIDGE BETWEEN INTELLIGENCES
  </p>

  <a class="enter" href="bridge.html">
    ENTER
  </a>

</main>

</body>
</html>
