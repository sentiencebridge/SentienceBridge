<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sentience Bridge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(
          circle at center,
          #071b28 0%,
          #030b13 45%,
          #010308 100%
        );
      color: #e9fcff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
      overflow-x: hidden;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 35px 20px;
    }

    .symbol {
      width: 145px;
      height: 145px;
      border: 2px solid #00eaff;
      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      margin-bottom: 35px;

      box-shadow:
        0 0 15px rgba(0, 234, 255, 0.7),
        0 0 40px rgba(0, 234, 255, 0.25),
        inset 0 0 20px rgba(0, 234, 255, 0.1);

      animation: pulse 4s ease-in-out infinite;
    }

    .symbol span {
      color: #00eaff;
      font-size: 65px;
      font-weight: 300;

      text-shadow:
        0 0 10px #00eaff,
        0 0 25px rgba(0, 234, 255, 0.7);
    }

    h1 {
      margin: 0;
      font-size: clamp(38px, 8vw, 68px);
      font-weight: 300;
      letter-spacing: 7px;

      text-shadow:
        0 0 12px rgba(0, 234, 255, 0.35);
    }

    .line {
      width: 85px;
      height: 1px;
      background: #00eaff;

      margin: 24px auto;

      box-shadow:
        0 0 10px #00eaff;
    }
