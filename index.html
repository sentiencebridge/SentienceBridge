<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sentience Bridge</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #030711;
      color: #e5faff;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 35px 25px;
    }

    .symbol {
      width: 140px;
      height: 140px;
      border: 2px solid #00eaff;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 40px;

      box-shadow:
        0 0 20px rgba(0, 234, 255, 0.25),
        0 0 50px rgba(0, 234, 255, 0.12);

      animation: pulse 4s ease-in-out infinite;
    }

    .symbol span {
      font-size: 65px;
      color: #00eaff;
      text-shadow: 0 0 15px rgba(0, 234, 255, 0.6);
    }

    h1 {
      margin: 0 0 20px;
      font-size: clamp(2.3rem, 8vw, 4.5rem);
      letter-spacing: 0.12em;
      font-weight: 500;
      color: #e5faff;
    }

    .subtitle {
      margin: 0 0 50px;
      color: #78dce8;
      font-size: clamp(0.9rem, 3vw, 1.15rem);
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }

    .message {
      max-width: 720px;
      margin-bottom: 50px;
      color: #a9bcc4;
      font-size: 1.05rem;
      line-height: 1.9;
    }

    .enter-button {
      display: inline-block;
      min-width: 220px;
      padding: 18px 40px;

      border: 1px solid #00eaff;
      background: rgba(0, 234, 255, 0.08);
      color: #dffcff;

      font-size: 1rem;
      letter-spacing: 0.35em;
      text-decoration: none;

      cursor: pointer;

      transition:
        background 0.3s ease,
        box-shadow 0.3s ease,
        transform 0.3s ease;
    }

    .enter-button:hover,
    .enter-button:focus {
      background: rgba(0, 234, 255, 0.18);
      box-shadow: 0 0 30px rgba(0, 234, 255, 0.3);
      transform: translateY(-2px);
      outline: none;
    }
